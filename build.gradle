plugins { id 'java' }

group = 'walksy.rawinputbuffer'
version = '1.1.0+1.8.9'
base.archivesName = 'RawInputBuffer-Forge'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://libraries.minecraft.net' }
}

configurations { lwjglNatives }

dependencies {
    // Only Forge and LWJGL symbols: no MCP workspace or reobfuscation required.
    compileOnly 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9:universal@jar'
    compileOnly 'com.google.guava:guava:17.0'
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    compileOnly 'net.java.dev.jna:jna:3.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    testImplementation 'net.java.dev.jna:jna:3.4.0'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.4-nightly-20150209:natives-windows'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
java { withSourcesJar() }
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand(version: project.version) }
}
def extractTestNatives = tasks.register('extractTestNatives', Copy) {
    from { configurations.lwjglNatives.collect { zipTree(it) } }
    include '*.dll'
    into layout.buildDirectory.dir('test-natives')
}

test {
    dependsOn extractTestNatives
    systemProperty 'org.lwjgl.librarypath', layout.buildDirectory.dir('test-natives').get().asFile.absolutePath
    if (project.hasProperty('testJavaHome')) {
        executable = "${project.property('testJavaHome')}/bin/java.exe"
    }
    testLogging { events 'passed', 'skipped', 'failed' }
}
jar {
    from('LICENSE')
    manifest.attributes('Implementation-Title': 'Raw Input Buffer (Forge 1.8.9)',
                        'Implementation-Version': project.version)
}
