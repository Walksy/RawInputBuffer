name: Build Forge 1.8.9
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 8 for runtime tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Save Java 8 location
        shell: pwsh
        run: '"JAVA8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - name: Install Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test on Java 8
        shell: pwsh
        run: './gradlew.bat build --no-daemon "-PtestJavaHome=$env:JAVA8_HOME"'
      - uses: actions/upload-artifact@v4
        with:
          name: RawInputBuffer-Forge-1.8.9
          path: build/libs/*.jar
